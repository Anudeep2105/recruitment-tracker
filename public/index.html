<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');:root{--g:#197255;--ink:#1e2c26;--mute:#829088;--line:#e8eeea;--bg:#f7f9f7;--mint:#eaf4ed;--lime:#d9f178;--red:#bd5f52;--amber:#bd7a3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:236px;background:white;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:3}.logo{font:800 17px Manrope;margin:0 8px 24px;white-space:nowrap}.logo i{font-style:normal;background:var(--g);color:white;border-radius:10px;padding:8px;margin-right:8px}.workspace{border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 2px 22px;font-size:12px}.workspace small,.user small{display:block;color:var(--mute);font-size:10px;margin-top:3px}.label{font-size:10px;letter-spacing:1px;color:#9aa59e;padding:0 10px;margin-bottom:8px}.nav{display:grid;gap:3px;overflow:auto}.nav button{border:0;background:none;text-align:left;padding:10px;border-radius:8px;color:#627068;cursor:pointer;font-size:12px}.nav button:hover,.nav button.on{background:var(--mint);color:var(--g);font-weight:700}.user{margin-top:auto;border-top:1px solid var(--line);padding:15px 6px 0;font-size:12px}.userrow{display:flex;justify-content:space-between;align-items:center}.user button{background:none;border:0;color:#758078;cursor:pointer}.main{margin-left:236px}.top{height:66px;position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;z-index:2;color:var(--mute);font-size:12px}.top input{border:1px solid var(--line);border-radius:8px;background:#fafbfa;padding:9px 12px;font-size:12px;outline:0;width:230px}.wrap{max-width:1440px;padding:28px 30px 55px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:21px}.eyebrow{font-size:10px;color:var(--g);font-weight:700;letter-spacing:1px;margin-bottom:7px}.title{font:700 25px Manrope;margin:0;letter-spacing:-.5px}.sub{color:var(--mute);font-size:12px;margin:7px 0}.btn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:8px;color:#4c5a52;font-size:11px;font-weight:600;cursor:pointer}.btn:hover{border-color:#bdcdc3}.primary{background:var(--g);border-color:var(--g);color:#fff}.primary:hover{background:#115d46}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 7px 22px #1d352008}.stat-label{font-size:11px;color:var(--mute)}.num{font:700 23px Manrope;margin:12px 0 3px}.trend{font-size:10px;color:var(--g)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;margin-bottom:13px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}.head b{font:700 13px Manrope}.head small{display:block;color:var(--mute);font-size:10px;margin-top:4px}.chart{height:158px;display:flex;align-items:end;justify-content:space-around;padding:7px 12px 23px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 37px,#edf1ee 38px);position:relative}.bar{width:25px;background:#bcd8c4;border-radius:4px 4px 0 0;position:relative;min-height:4px}.bar:after{content:'';position:absolute;left:13px;bottom:0;width:11px;height:64%;background:var(--g);border-radius:4px 4px 0 0}.bar span{position:absolute;top:calc(100% + 6px);font-size:9px;color:#9aa49e;left:2px}.donutrow{display:flex;justify-content:center;align-items:center;gap:23px;min-height:160px}.donut{width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--g) 0 38%,#9fcea9 38% 65%,var(--lime) 65% 82%,#f0aa76 82% 94%,#eee 94%);display:grid;place-items:center}.donut:after{content:attr(data-total);font:700 15px Manrope;background:white;width:74px;height:74px;border-radius:50%;display:grid;place-items:center}.legend{display:grid;gap:10px;font-size:10px;color:#657269}.legend span{display:flex;gap:7px;align-items:center}.legend i{width:8px;height:8px;border-radius:50%;background:var(--g)}.legend strong{margin-left:8px;color:#33443a}.bottom{display:grid;grid-template-columns:1.5fr 1fr;gap:13px}.table-card{padding:0;overflow:hidden}.table-head{padding:15px 16px 3px}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#9aa49e;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid #f0f3f1;font-size:10px;color:#59665f;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}td b{color:#34443b}.pill{border-radius:14px;padding:5px 8px;background:#fff3e5;color:var(--amber);font-size:9px;white-space:nowrap}.pill.Paid,.pill.Joined,.pill.Open,.pill.Closed{background:#eaf5ed;color:#39805b}.pill.Overdue,.pill.Rejected{background:#fff0ec;color:var(--red)}.pill.In-Process,.pill.Interview{background:#edf2ff;color:#5975b5}.pill.Sourced,.pill.Shortlisted{background:#f2edfa;color:#8164ac}.activity{font-size:10px;color:#58665e;line-height:1.5}.activity div{padding:10px 0;border-bottom:1px solid #f0f3f1}.activity small{display:block;color:#9aa49e;font-size:9px}.section{display:none}.section.show{display:block}.toolbar{display:flex;align-items:center;gap:8px}.filter{border:1px solid var(--line);border-radius:8px;background:white;padding:9px 10px;font-size:11px;width:170px;outline:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;font-weight:700;color:#758078;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:12px;outline:0;background:white}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#78aa8c;box-shadow:0 0 0 3px #eaf4ed}.field.full{grid-column:1/-1}.modal-bg{display:none;position:fixed;inset:0;background:#10231db3;z-index:8;align-items:center;justify-content:center;padding:18px}.modal-bg.open{display:flex}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:22px;box-shadow:0 20px 70px #0003}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-title h2{font:700 18px Manrope;margin:0}.close{border:0;background:none;font-size:22px;color:#76827b;cursor:pointer}.actions{display:flex;justify-content:end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;right:22px;background:#20342b;color:white;padding:11px 15px;border-radius:8px;opacity:0;transition:.2s;z-index:9;font-size:12px}.toast.show{opacity:1}.notice{background:#f2f6e6;padding:12px;border-radius:8px;color:#606e4a;font-size:11px;margin-bottom:14px}.empty{text-align:center;padding:48px 15px;color:var(--mute)}.empty b{display:block;color:var(--ink);margin-bottom:6px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 10%,#e9f5ed,transparent 45%),var(--bg)}.loginbox{width:min(400px,100%);background:white;padding:28px;border:1px solid var(--line);border-radius:15px;box-shadow:0 18px 55px #20352a12}.loginbox .logo{margin:0 0 25px}.loginbox h1{font:700 22px Manrope;margin:0}.loginbox p{color:var(--mute);font-size:12px;margin:6px 0 22px}.loginbox .field{margin-bottom:12px}.loginbox .btn{width:100%;margin-top:7px}.error{color:var(--red);font-size:11px;min-height:17px}.linkbtn{border:0;background:none;color:var(--g);cursor:pointer;font-size:11px}.inline-actions{display:flex;gap:5px}.inline-actions button{border:1px solid var(--line);background:white;border-radius:6px;padding:5px 7px;font-size:9px;cursor:pointer;color:#526158}.userrole{font-size:9px;color:var(--mute);text-transform:capitalize}
@media(max-width:1000px){.side{width:205px}.main{margin-left:205px}.wrap{padding:24px 18px}.top{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.bottom{grid-template-columns:1fr}}@media(max-width:680px){.side{position:relative;width:auto;height:auto;inset:auto;padding:12px 10px;display:block}.logo{margin:0 4px 12px}.workspace,.label,.user{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.main{margin:0}.top{height:52px;padding:0 12px}.top input{width:155px}.wrap{padding:19px 11px}.welcome{align-items:start;flex-direction:column}.title{font-size:22px}.stats{gap:8px}.card{padding:13px}.table-card{padding:0}.bottom,.grid{gap:9px}.toolbar{width:100%;flex-wrap:wrap}.filter{flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.actions{position:sticky;bottom:-22px;background:white;padding:12px 0 0}}
</style></head><body>
<div id="login" class="login hidden"><form class="loginbox" onsubmit="login(event)"><div class="logo"><i>✳</i>northstar / talent</div><h1>Welcome back</h1><p>Sign in to your recruitment workspace.</p><div id="loginFields"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div></div><div id="loginError" class="error"></div><button class="btn primary" id="loginButton">Sign in</button></form></div>
<div id="app" class="shell hidden"><aside class="side"><div class="logo"><i>✳</i>northstar / talent</div><div class="workspace"><small>WORKSPACE</small><b>Recruitment business　⌄</b></div><div class="label">WORKSPACE</div><nav id="nav" class="nav"></nav><div class="user"><div class="userrow"><b id="userName">Account</b><button onclick="logout()">Sign out</button></div><small><span id="userRole" class="userrole"></span></small></div></aside><main class="main"><header class="top"><span>Workspace　/　<b id="crumb">Overview</b></span><div><input id="globalSearch" placeholder="⌕ Search this page" oninput="filterCurrent(this.value)"></div></header><div class="wrap"><section id="overview" class="section"></section><section id="page" class="section"></section></div></main></div>
<div class="modal-bg" id="modal"><div class="modal"><div class="modal-title"><h2 id="modalTitle">Add record</h2><button class="close" onclick="closeModal()">×</button></div><form id="form" onsubmit="saveForm(event)"><div id="fields" class="form-grid"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save record</button></div></form></div></div><div id="toast" class="toast"></div>
<script>
const labels={overview:'Overview',clients:'Clients',jobs:'Jobs & positions',candidates:'Candidates',applications:'Candidate pipeline',placements:'Placements',invoices:'Invoices & receivables',recruiters:'Recruiter performance',reports:'Reports',users:'Team & access'};
const navDefs=[['overview','◫'],['clients','♧'],['jobs','▤'],['candidates','♙'],['applications','⇢'],['placements','✣'],['invoices','▧'],['recruiters','♧'],['reports','▥'],['users','⚙']];
const stages=['Sourced','Screening','Shortlisted','Interview','Offer','Joined','Rejected'];
const fields={clients:[['name','Client name'],['industry','Industry'],['contact','Primary contact'],['email','Contact email','email'],['phone','Phone'],['payment_days','Payment terms (days)','number'],['notes','Notes','textarea']],jobs:[['title','Position title'],['client_id','Client','select:clients'],['recruiter_id','Recruiter','select:users'],['status','Status','select:jobstatus'],['fee_type','Fee type','select:feetype'],['fee_amount','Fee amount','number'],['openings','Openings','number'],['priority','Priority','select:priority'],['description','Description','textarea']],candidates:[['name','Candidate name'],['email','Email','email'],['phone','Phone'],['current_title','Current title'],['skills','Skills (comma separated)'],['experience','Experience (years)','number'],['location','Location'],['source','Source'],['owner_id','Recruiter owner','select:users'],['notes','Notes','textarea']],applications:[['candidate_id','Candidate','select:candidates'],['job_id','Position','select:jobs'],['stage','Stage','select:stage'],['interview_at','Interview date/time','datetime-local'],['feedback','Feedback / notes','textarea']],placements:[['candidate_id','Candidate','select:candidates'],['job_id','Position','select:jobs'],['client_id','Client','select:clients'],['recruiter_id','Recruiter','select:users'],['joined_on','Joining date','date'],['fee','Placement fee (₹)','number'],['payment_days','Payment terms (days)','select:terms'],['replacement_days','Replacement guarantee (days)','select:guarantee'],['notes','Notes','textarea']],invoices:[['client_id','Client','select:clients'],['placement_id','Placement (optional)','select:placements'],['issue_date','Invoice date','date'],['due_date','Due date (optional — calculated from client terms)','date'],['amount','Invoice amount (₹)','number'],['notes','Notes','textarea']],payments:[['invoice_id','Invoice','select:invoices'],['amount','Payment amount (₹)','number'],['received_on','Date received','date'],['method','Payment method'],['reference','Reference'],['notes','Notes','textarea']],users:[['name','Full name'],['email','Email','email'],['password','Temporary password (12+ characters)','password'],['role','Role','select:roles']]};
const permsByNav={overview:'dashboard:read',clients:'clients:read',jobs:'jobs:read',candidates:'candidates:read',applications:'candidates:read',placements:'placements:read',invoices:'invoices:read',recruiters:'recruiters:read',reports:'reports:read',users:'users:read'};let me=null,permissions=[],cache={},current='overview';
async function api(url,opts={}){let r=await fetch('/api'+url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}}),data=await r.json().catch(()=>({}));if(r.status===401&&url!=='/me'){showLogin();throw new Error(data.error||'Sign in required')}if(!r.ok)throw new Error(data.error||'Request failed');return data}
function showLogin(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
async function login(e){e.preventDefault();let f=new FormData(e.target),setup=e.target.dataset.setup==='true';document.getElementById('loginError').textContent='';try{let r=await api(setup?'/setup':'/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await boot(r.user)}catch(err){document.getElementById('loginError').textContent=err.message}}
async function showLogin(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');try{let r=await fetch('/api/setup').then(x=>x.json());if(r.required){let f=document.querySelector('.loginbox');f.dataset.setup='true';f.querySelector('h1').textContent='Set up your workspace';f.querySelector('p').textContent='Create the founder account for this computer.';document.getElementById('loginFields').innerHTML='<div class="field"><label>Your name</label><input name="name" autocomplete="name" required></div><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password (12+ characters)</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div>';document.getElementById('loginButton').textContent='Create founder account'}}catch{}}
async function logout(){await api('/logout',{method:'POST'});me=null;showLogin()}
async function boot(user){me=user||me;let r=await api('/me');me=r.user;permissions=r.permissions;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=me.name;document.getElementById('userRole').textContent=me.role;buildNav();await go('overview')}
function allowed(nav){return permissions.includes('*')||permissions.includes(permsByNav[nav])}
function buildNav(){let el=document.getElementById('nav');el.innerHTML=navDefs.filter(([k])=>allowed(k)).map(([k,icon])=>`<button data-page="${k}" class="${k===current?'on':''}">${icon}　${labels[k]}</button>`).join('');el.onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)}}
async function go(p){current=p;document.getElementById('crumb').textContent=labels[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));document.getElementById('overview').classList.toggle('show',p==='overview');document.getElementById('page').classList.toggle('show',p!=='overview');document.getElementById('globalSearch').value='';if(p==='overview')await renderOverview();else if(p==='reports')await renderReports();else if(p==='recruiters')await renderRecruiters();else await renderTable(p)}
const num=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n||0),money=n=>'₹'+num(n),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function renderOverview(){let d=await api('/dashboard');cache.invoices=d.invoices;let m=d.metrics;let max=Math.max(1,...d.clients.map(c=>c.revenue));document.getElementById('overview').innerHTML=`<div class="welcome"><div><div class="eyebrow">RECRUITMENT BUSINESS / LIVE</div><h1 class="title">Good day, ${safe(me.name.split(' ')[0])}</h1><p class="sub">Your hiring, placements and collections at a glance.</p></div><button class="btn primary" onclick="openForm('clients')">＋ Add client</button></div><div class="stats"><div class="card"><div class="stat-label">Open positions</div><div class="num">${num(m.open_jobs)}</div><div class="trend">Currently accepting candidates</div></div><div class="card"><div class="stat-label">Candidate database</div><div class="num">${num(m.candidates)}</div><div class="trend">${num(d.pipeline.reduce((n,x)=>n+x.count,0))} active applications</div></div><div class="card"><div class="stat-label">Invoiced this month</div><div class="num">${money(m.invoiced_this_month)}</div><div class="trend">${num(m.placements_this_month)} placements joined</div></div><div class="card"><div class="stat-label">Overdue receivables</div><div class="num">${money(m.overdue)}</div><div class="trend" style="color:${m.overdue?'var(--red)':'var(--g)'}">${d.invoices.filter(i=>i.status==='Overdue').length} invoices overdue</div></div></div><div class="grid"><div class="card"><div class="head"><div><b>Client revenue</b><small>Lifetime invoiced value and unpaid balance</small></div><button class="btn" onclick="go('clients')">Clients →</button></div><div style="display:grid;gap:12px;padding:4px 0">${d.clients.length?d.clients.map(c=>`<div style="display:grid;grid-template-columns:120px 1fr 95px;gap:8px;align-items:center;font-size:10px"><b>${safe(c.name)}</b><div style="height:8px;border-radius:9px;background:#edf2ee"><i style="display:block;width:${Math.max(3,c.revenue/max*100)}%;height:8px;border-radius:9px;background:var(--g)"></i></div><span style="text-align:right">${money(c.revenue)}</span></div>`).join(''):'<div class="empty">Add clients and invoices to see revenue.</div>'}</div><div class="sub">Outstanding across clients: <b>${money(m.outstanding)}</b></div></div><div class="card"><div class="head"><div><b>Pipeline health</b><small>Candidate applications by stage</small></div><button class="btn" onclick="go('applications')">Open pipeline →</button></div>${d.pipeline.length?d.pipeline.map(x=>`<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:11px"><span><span class="pill ${safe(x.stage)}">${safe(x.stage)}</span></span><b>${x.count}</b></div>`).join(''):'<div class="empty">No applications yet.</div>'}</div></div><div class="bottom"><div class="card table-card"><div class="table-head"><div class="head"><div><b>Upcoming & overdue invoices</b><small>Receivables by due date</small></div><button class="btn" onclick="go('invoices')">View all →</button></div></div>${table('invoices',d.invoices.slice(0,6))}</div><div class="card"><div class="head"><div><b>Recruiter performance</b><small>Placements and fee revenue</small></div></div>${d.recruiters.length?d.recruiters.slice(0,5).map(r=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px"><span><b>${safe(r.name)}</b><small style="display:block;color:var(--mute)">${r.placements} placements</small></span><b>${money(r.revenue)}</b></div>`).join(''):'<div class="empty">No recruiter placements yet.</div>'}</div></div>`}
const headers={clients:['Client','Industry','Contact','Payment terms','Phone'],jobs:['Position','Client','Recruiter','Status','Fee'],candidates:['Candidate','Current title','Skills','Experience','Owner'],applications:['Candidate','Position','Client','Stage','Interview','Recruiter'],placements:['Candidate','Position','Client','Recruiter','Joined','Fee','Replacement until'],invoices:['Invoice','Client','Invoice date','Due date','Amount','Outstanding','Status'],users:['Name','Email','Role','Active','Created'],payments:['Invoice','Client','Amount','Received','Method','Reference']};
function table(kind,rows){let hs=headers[kind]||[];if(!rows?.length)return '<div class="empty"><b>No records yet</b>Add your first record to start building your workspace.</div>';return `<div class="table"><table><thead><tr>${hs.map(h=>`<th>${h}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr>${rowCells(kind,x).map((v,i)=>`<td>${i===0?'<b>':''}${v??'—'}${i===0?'</b>':''}</td>`).join('')}<td>${actions(kind,x)}</td></tr>`).join('')}</tbody></table></div>`}
function rowCells(k,x){if(k==='clients')return[safe(x.name),safe(x.industry),safe(x.contact),`${x.payment_days||30} days`,safe(x.phone)];if(k==='jobs')return[safe(x.title),safe(x.client_name),safe(x.recruiter_name),`<span class="pill ${safe(x.status)}">${safe(x.status)}</span>`,x.fee_type==='Percent'?`${x.fee_amount}%` :money(x.fee_amount)];if(k==='candidates')return[safe(x.name),safe(x.current_title),safe(x.skills),`${x.experience||0} yrs`,safe(x.owner_name)];if(k==='applications')return[safe(x.candidate_name),safe(x.job_title),safe(x.client_name),`<select class="filter" style="width:116px;padding:5px" onchange="updateStage(${x.id},this.value)">${stages.map(s=>`<option ${s===x.stage?'selected':''}>${s}</option>`).join('')}</select>`,safe((x.interview_at||'').replace('T',' ')),safe(x.recruiter_name)];if(k==='placements')return[safe(x.candidate_name),safe(x.job_title),safe(x.client_name),safe(x.recruiter_name),safe(x.joined_on),money(x.fee),safe(x.replacement_until)];if(k==='invoices')return[safe(x.number),safe(x.client_name),safe(x.issue_date),safe(x.due_date),money(x.amount),money(x.remaining),`<span class="pill ${safe(x.status)}">${safe(x.status)}</span>`];if(k==='users')return[safe(x.name),safe(x.email),safe(x.role),x.active?'Active':'Inactive',safe(x.created_at.slice(0,10))];if(k==='payments')return[safe(x.invoice_number),safe(x.client_name),money(x.amount),safe(x.received_on),safe(x.method),safe(x.reference)];return[]}
function actions(k,x){let bits=[];if(k==='invoices'&&x.remaining>0&&allowed('invoices'))bits.push(`<button onclick="openPayment(${x.id},${x.remaining})">Record payment</button>`);if(k==='jobs'&&allowed('applications'))bits.push(`<button onclick="openApplication(${x.id})">＋ Candidate</button>`);let perm=({clients:'clients:write',jobs:'jobs:write',candidates:'candidates:write',applications:'candidates:write',placements:'placements:write',invoices:'invoices:write'})[k];if(perm&&(permissions.includes('*')||permissions.includes(perm)))bits.push(`<button onclick="openEdit('${k}',${x.id})">Edit</button>`);if(permissions.includes('*')&&k!=='users')bits.push(`<button onclick="removeRecord('${k}',${x.id})">Delete</button>`);return bits.length?`<div class="inline-actions">${bits.join('')}</div>`:'—'}
async function renderTable(p){let rows=await api('/'+p);cache[p]=rows;let addPerm=permissions.includes('*')||permissions.includes(({clients:'clients:write',jobs:'jobs:write',candidates:'candidates:write',applications:'candidates:write',placements:'placements:write',invoices:'invoices:write',users:'users:write'})[p]);let title=p==='applications'?'Candidate pipeline':labels[p];document.getElementById('page').innerHTML=`<div class="welcome"><div><div class="eyebrow">WORKSPACE / ${title.toUpperCase()}</div><h1 class="title">${title}</h1><p class="sub">${description(p)}</p></div><div class="toolbar"><input class="filter" id="filter" placeholder="⌕ Filter records" oninput="filterCurrent(this.value)">${addPerm?`<button class="btn primary" onclick="${p==='applications'?'openApplication()':`openForm('${p}')`}">＋ Add ${addLabel(p)}</button>`:''}</div></div><div class="card table-card">${table(p,rows)}</div>`}
function description(p){return {clients:'Client relationships, contacts, and payment terms.',jobs:'Open requisitions, recruiter ownership, and fee terms.',candidates:'Candidate database, contact details, and recruiter ownership.',applications:'Manage candidate progress and interview feedback by job.',placements:'Joining records, recruiter credit, fees, and replacement guarantees.',invoices:'Invoices, payment terms, collections, and overdue receivables.',users:'Manage workspace access and role permissions.'}[p]||''}function addLabel(p){return {clients:'client',jobs:'position',candidates:'candidate',applications:'application',placements:'placement',invoices:'invoice',users:'user'}[p]||'record'}
async function renderRecruiters(){let d=await api('/dashboard'),rows=d.recruiters;document.getElementById('page').innerHTML=`<div class="welcome"><div><div class="eyebrow">TEAM / PERFORMANCE</div><h1 class="title">Recruiter performance</h1><p class="sub">Placed hires and revenue credited by recruiter.</p></div></div><div class="card table-card">${rows.length?`<div class="table"><table><thead><tr><th>Recruiter</th><th>Placements</th><th>Placement revenue</th><th>Share of total</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${safe(r.name)}</b></td><td>${r.placements}</td><td><b>${money(r.revenue)}</b></td><td>${d.metrics.invoiced_this_month?Math.round(r.revenue/Math.max(1,rows.reduce((n,x)=>n+x.revenue,0))*100):0}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add users and record placements to see performance.</div>'}</div>`}
async function renderReports(){let d=await api('/dashboard'),inv=await api('/invoices'),aging=[['Not yet due',inv.filter(x=>x.status!=='Paid'&&x.due_date>=new Date().toISOString().slice(0,10))],['1–30 days overdue',inv.filter(x=>x.status==='Overdue'&&x.aging_days<=30)],['31–60 days overdue',inv.filter(x=>x.status==='Overdue'&&x.aging_days>30&&x.aging_days<=60)],['60+ days overdue',inv.filter(x=>x.status==='Overdue'&&x.aging_days>60)]];document.getElementById('page').innerHTML=`<div class="welcome"><div><div class="eyebrow">BUSINESS INTELLIGENCE</div><h1 class="title">Reports & cash flow</h1><p class="sub">Outstanding receivables, aging, revenue by client and recruiter.</p></div><button class="btn" onclick="exportCSV()">⇩ Export CSV</button></div><div class="stats"><div class="card"><div class="stat-label">Invoiced this month</div><div class="num">${money(d.metrics.invoiced_this_month)}</div></div><div class="card"><div class="stat-label">Outstanding receivables</div><div class="num">${money(d.metrics.outstanding)}</div></div><div class="card"><div class="stat-label">Overdue</div><div class="num">${money(d.metrics.overdue)}</div></div><div class="card"><div class="stat-label">Joined this month</div><div class="num">${d.metrics.placements_this_month}</div></div></div><div class="grid"><div class="card"><div class="head"><div><b>Receivables aging</b><small>Unpaid balances grouped by due date</small></div></div>${aging.map(([label,rows])=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px"><span>${label} · ${rows.length} invoices</span><b>${money(rows.reduce((n,x)=>n+x.remaining,0))}</b></div>`).join('')}</div><div class="card"><div class="head"><div><b>Expected collections</b><small>Upcoming invoice due dates</small></div></div>${d.cash.length?d.cash.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:11px"><span>${safe(x.due_date)}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="empty">No future-dated receivables.</div>'}</div></div><div class="grid"><div class="card"><div class="head"><div><b>Client revenue</b><small>Invoice value and unpaid balances</small></div></div>${d.clients.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:11px"><span>${safe(c.name)}</span><span><b>${money(c.revenue)}</b> <small style="color:var(--mute)">· ${money(c.outstanding)} unpaid</small></span></div>`).join('')}</div><div class="card"><div class="head"><div><b>Recruiter results</b><small>Placement value credited</small></div></div>${d.recruiters.map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:11px"><span>${safe(r.name)} · ${r.placements} placements</span><b>${money(r.revenue)}</b></div>`).join('')}</div></div>`}
function options(type){if(type==='stage')return stages.map(s=>[s,s]);if(type==='jobstatus')return ['Open','On hold','Filled','Cancelled'].map(s=>[s,s]);if(type==='feetype')return ['Fixed','Percent'].map(s=>[s,s]);if(type==='priority')return ['Normal','High','Urgent'].map(s=>[s,s]);if(type==='terms')return [30,45,60,90].map(s=>[s+' days',s]);if(type==='guarantee')return [30,45,60,90].map(s=>[s+' days',s]);if(type==='roles')return ['admin','recruiter','finance'].map(s=>[s,s]);let rows=cache[type]||[];if(!rows.length)return [['','No records available']];return rows.map(r=>[r.id,type==='clients'?r.name:type==='jobs'?`${r.title} — ${r.client_name||''}`:type==='candidates'?`${r.name} — ${r.current_title||''}`:type==='users'?r.name:type==='placements'?`${r.candidate_name} — ${r.client_name}`:r.number])}
function inputFor([key,label,type],idx){let cls=idx>=4?'field full':'field',req=!['notes','feedback','interview_at','placement_id','password','due_date'].includes(key);if(type?.startsWith('select:')){let opts=options(type.slice(7));return `<div class="${cls}"><label>${label}</label><select name="${key}" ${req?'required':''}>${opts.map(([v,l])=>`<option value="${safe(v)}">${safe(l)}</option>`).join('')}</select></div>`}let t=type||'text';return `<div class="${cls}"><label>${label}</label>${t==='textarea'?`<textarea name="${key}"></textarea>`:`<input name="${key}" type="${t}" ${req?'required':''} ${t==='number'?'step="any"':''} ${key==='password'?'minlength="12"':''}>`}</div>`}
async function openForm(p){if(p==='jobs'||p==='candidates'||p==='placements'||p==='invoices'||p==='applications'||p==='users')for(let k of ['clients','jobs','candidates','users','placements','invoices'])try{cache[k]=await api('/'+k)}catch{}let definitions=fields[p];if(p==='invoices')definitions=fields.invoices.map(f=>f[0]==='placement_id'?['placement_id','Placement (optional)','select:placements']:f);document.getElementById('modalTitle').textContent='Add '+addLabel(p);document.getElementById('fields').innerHTML=definitions.map(inputFor).join('');document.getElementById('form').dataset.kind=p;document.getElementById('form').dataset.id='';document.getElementById('modal').classList.add('open')}
async function openEdit(p,id){let rows=cache[p]||await api('/'+p),item=rows.find(x=>x.id===id);if(!item)return toast('Record not found');if(['jobs','placements','invoices','applications'].includes(p))for(let k of ['clients','jobs','candidates','users','placements','invoices'])try{cache[k]=await api('/'+k)}catch{}let definitions=fields[p];document.getElementById('modalTitle').textContent='Edit '+addLabel(p);document.getElementById('fields').innerHTML=definitions.map(inputFor).join('');let form=document.getElementById('form');form.dataset.kind=p;form.dataset.id=id;for(let [k,v] of Object.entries(item)){let el=form.elements.namedItem(k);if(el&&v!=null)el.value=v}document.getElementById('modal').classList.add('open')}
async function removeRecord(p,id){if(!confirm('Delete this record? This cannot be undone.'))return;try{await api('/'+p+'/'+id,{method:'DELETE'});toast('Record deleted');await go(current)}catch(e){toast(e.message)}}
async function openPayment(id,remaining){cache.invoices=cache.invoices||await api('/invoices');let inv=cache.invoices.find(i=>i.id===id);document.getElementById('modalTitle').textContent=`Record payment · ${inv?.number||''} (${money(remaining)} remaining)`;cache.paymentInvoice=id;document.getElementById('fields').innerHTML=fields.payments.filter(x=>x[0]!=='invoice_id').map(inputFor).join('');document.getElementById('form').dataset.kind='payment';document.getElementById('modal').classList.add('open')}
async function openApplication(jobId){for(let k of ['clients','jobs','candidates','users'])cache[k]=await api('/'+k);document.getElementById('modalTitle').textContent='Add candidate to pipeline';let fs=fields.applications.slice();if(jobId){fs=fs.filter(x=>x[0]!=='job_id');cache.fixedJob=jobId}document.getElementById('fields').innerHTML=fs.map(inputFor).join('');document.getElementById('form').dataset.kind='application';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveForm(e){e.preventDefault();let kind=e.target.dataset.kind,data=Object.fromEntries(new FormData(e.target)),id=e.target.dataset.id;try{if(kind==='payment'){data.invoice_id=cache.paymentInvoice;await api('/payments',{method:'POST',body:JSON.stringify(data)})}else if(id){await api('/'+kind+'/'+id,{method:'PATCH',body:JSON.stringify(data)})}else{if(kind==='application'&&cache.fixedJob)data.job_id=cache.fixedJob;await api('/'+kind,{method:'POST',body:JSON.stringify(data)})}e.target.dataset.id='';closeModal();toast('Saved successfully');await go(current)}catch(err){toast(err.message)}}
async function updateStage(id,stage){try{await api('/applications/'+id,{method:'PATCH',body:JSON.stringify({stage})});toast('Pipeline stage updated')}catch(e){toast(e.message)}}
function filterCurrent(q){let table=document.querySelector('#page tbody');if(!table)return;[...table.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function exportCSV(){let rows=cache.invoices||[];let data=[['Invoice','Client','Issue date','Due date','Amount','Paid','Outstanding','Status'],...rows.map(x=>[x.number,x.client_name,x.issue_date,x.due_date,x.amount,x.paid_amount,x.remaining,x.status])];let csv=data.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='recruitment-receivables.csv';a.click();URL.revokeObjectURL(a.href)}
let toastTimer;function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});fetch('/api/me').then(async r=>{if(r.ok){let d=await r.json();await boot(d.user)}else showLogin()}).catch(showLogin);
</script></body></html>
